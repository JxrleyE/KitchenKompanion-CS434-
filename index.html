<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Kompanion</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="device">

    <!-- Kitchen Screen -->
    <div id="Kitchen" class="tabcontent scroll">
      <h1 id="kitchen_header">Kitchen Kompanion</h1>
      <h2>My Kitchen</h2>
      <p>View and manage your food inventory.</p>
      
  <div class="storage-buttons">
    <button onclick="changeLocation('Fridge')">Fridge</button>
    <button onclick="changeLocation('Pantry')">Pantry</button>
    <button onclick="changeLocation('Freezer')">Freezer</button>
  </div>

  
  <h3 id="locationTitle">Fridge Items</h3>

  <div id="inventoryList"></div>

</div>
   

    <!-- Shopping Screen -->
    <div id="Shopping" class="tabcontent scroll">
      <h2>Shopping List</h2>
      <p>Keep track of groceries you need to buy.</p>
    </div>

    <!-- Recipes Screen -->
    <div id="Recipes" class="tabcontent scroll">
      <h2>Recipes</h2>
      <p>Find recipes using ingredients you have.</p>
    </div>

    <!-- Bottom Navigation -->
    <div class="footer">

      <button class="tablink active" 
              onclick="openCity('Kitchen')" 
              id="defaultOpen">

        <img src="icons/fridge-active.svg" class="tabicon" alt="">
        Kitchen
      </button>

      <button
        class="tablink"
        onclick="openCity('Shopping')">

        <img src="icons/cart-inactive.svg" class="tabicon" alt="">
        Shopping
      </button>

      <button
        class="tablink"
        onclick="openCity('Recipes')">

         <img src="icons/recipes-inactive.svg" class="tabicon" alt="">
        Recipes
      </button>

    </div>

  </div>
</body>
</html>
