
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Kompanion</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="device">

    <!-- Home Screen -->
    <div id="Home" class="tabcontent">
      <h1>Kitchen Kompanion</h1>
      <h2>Welcome to Your Kitchen!</h2>

      <p>
        Keep track of your groceries, organize your
        kitchen, and find recipes all in one place.
      </p>

      </div>

    <!-- Kitchen Tab -->
    <div id="Kitchen" class="tabcontent">
      <h2>My Kitchen</h2>
      <p>View and manage your food inventory.</p>
    </div>

    <!-- Shopping List Tab -->
    <div id="Shopping" class="tabcontent">
      <h2>Shopping List</h2>
      <p>Keep track of groceries you need to buy.</p>
    </div>

    <!-- Recipes Tab -->
    <div id="Recipes" class="tabcontent">
      <h2>Recipes</h2>
      <p>Find recipes using ingredients you have.</p>
    </div>

    <!-- Bottom Navigation -->
    <div class="footer">
      <button class="tablink" onclick="openCity('Home')">
        Home
      </button>

      <button class="tablink" onclick="openCity('Kitchen')">
        Kitchen
      </button>

      <button class="tablink" onclick="openCity('Shopping')">
        Shopping
      </button>

      <button class="tablink" onclick="openCity('Recipes')">
        Recipes
      </button>
    </div>

  </div>
</body>
</html>
